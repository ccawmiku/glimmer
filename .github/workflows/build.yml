name: build

# Builds the firmware + LittleFS images and publishes them so a device can be
# flashed for the first time WITHOUT a local PlatformIO toolchain.
#
#   - push to main        → rebuilds and replaces the rolling `latest` release
#                           (stable URLs, always current)
#   - push a v* tag       → cuts a permanent, versioned release
#   - pull request         → build only (uploads a CI artifact, no release)
#
# First-time flash (see FLASHING.md):
#   curl -L -O https://github.com/<owner>/glimmer/releases/download/latest/littlefs.bin
#   curl -L -O https://github.com/<owner>/glimmer/releases/download/latest/firmware.bin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify gallery against upstream renderer
        run: python tests/verify_gallery.py

      - name: Build firmware
        run: pio run -e nodemcuv2

      - name: Build filesystem (LittleFS)
        run: pio run -e nodemcuv2 -t buildfs

      - name: Stage binaries and flash package
        id: stage
        run: |
          python tools/package.py
          ver=$(python -c 'import json; print(json.load(open("dist/manifest.json"))["version"])')
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: glimmer-binaries
          path: dist/*
          retention-days: 30

      # ── Rolling `latest` release — every push to main ──
      # Delete the old one first so the `latest` tag moves to this commit and
      # assets are replaced cleanly (softprops won't move an existing tag).
      - name: Reset rolling 'latest' release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag --yes || true

      - name: Publish rolling 'latest' release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "glimmer — latest main build (${{ steps.stage.outputs.version }})"
          body: |
            Auto-built from `main` (`${{ github.sha }}`), firmware **${{ steps.stage.outputs.version }}**.

            First-time flash — no toolchain needed (see [FLASHING.md](../../blob/main/FLASHING.md)).
            先刷固件，再刷文件系统。刷写文件系统前导出配置备份：
            ```bash
            curl -L -O https://github.com/${{ github.repository }}/releases/download/latest/littlefs.bin
            curl -L -O https://github.com/${{ github.repository }}/releases/download/latest/firmware.bin
            curl -F "firmware=@firmware.bin"   http://<device-ip>/update
            # 等待重启；若进入配网热点，把地址改为 192.168.4.1。
            curl -F "filesystem=@littlefs.bin" http://<device-ip>/update
            ```
          files: |
            dist/*.bin
            dist/*.zip
            dist/SHA256SUMS
            dist/manifest.json
          make_latest: 'true'
          prerelease: false

      # ── Versioned release — on a v* tag ──
      - name: Publish versioned release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "glimmer ${{ github.ref_name }}"
          body: |
            Firmware **${{ steps.stage.outputs.version }}** — tag `${{ github.ref_name }}`.

            Download `firmware.bin` / `littlefs.bin` below, or always grab the
            newest main build from the [`latest`](../../releases/download/latest/firmware.bin) release.
          files: |
            dist/*.bin
            dist/*.zip
            dist/SHA256SUMS
            dist/manifest.json
          # Don't steal the "Latest" pointer from the rolling main build.
          make_latest: 'false'
